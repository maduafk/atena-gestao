version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: atena-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: atena-db
    ports:
      - "5432:5432"
    volumes:
      - atena_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d atena-db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  atena_postgres_data:
